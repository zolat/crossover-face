# Publish the web configurator to GitHub Pages whenever main changes it.
#
# The site is web/configurator's static build. Everything it reads from the face (the
# lattices in public/geometry and src/generated/face-schema.json) is committed, so the
# build needs no SDK. The schema is checked against the face's own files first, so a
# settings change that was not re-exported fails here rather than shipping a page that
# offers values the watch no longer has.
name: Configurator on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/configurator/**"
      - "resources/**"
      - "source/data/Source.mc"
      - "source/matrix/**"
      - "source/render/Palette.mc"
      - "source-hands/**"
      - "tools/face_schema_export.py"
      - ".github/workflows/configurator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/configurator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The face schema matches the face
        working-directory: .
        run: python3 tools/face_schema_export.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/configurator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/configurator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
